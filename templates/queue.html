<!DOCTYPE html>
<html>
<head>
<title>Queue Status</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

<h1 class="title mb-4">
📊 Live Queue Status
</h1>

<div class="row">

{% for a in appointments %}

<div class="col-md-4">

<div class="main-card mb-3">
    <h2>{{a.token}}</h2>

    <p>
        <b>Patient:</b>
        {{a.name}}
    </p>

    <p>
        <b>Doctor:</b>
        {{a.doctor}}
    </p>

    <hr>

    <p>
        👥 Patients Ahead:
        <b>{{a.ahead}}</b>
    </p>

    <p>
        ⏱ Estimated Wait:
        <b>{{a.waiting_time}} Minutes</b>
    </p>

    <p>
        🩺 Current Serving:
        HSP-{{'%03d' % current_serving}}
    </p>


<span class="badge bg-success">
Waiting
</span>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>
